<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phú Gia Bảo Lộc — Intro</title>
<style>
  /* ============================================================
     MÀN INTRO LOGO — Phú Gia Bảo Lộc
     (bóc cơ chế từ thanhxuanvalley.com, dựng lại cho PGBL)
     ------------------------------------------------------------
     ĐỔI 2 THỨ KHI CÓ LOGO THẬT:
       1) --intro-bg  : màu nền brand PGBL
       2) .intro-logo img  ->  thay src bằng logo PGBL (PNG nền trong)
     ============================================================ */
  :root{
    --intro-bg: #f7f5f0;   /* nền dự phòng khi ảnh marble chưa tải */
    --intro-line: #B8935A; /* nét trang trí — gold đậm để nổi trên marble */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d0d0d}

  /* ---- lớp phủ intro toàn màn ---- */
  .intro-page{
    position:fixed; inset:0; z-index:9999;
    display:flex; align-items:center; justify-content:center;
    background:var(--intro-bg) url("assets/bg-marble.jpg") center/cover no-repeat;
    overflow:hidden;
  }
  /* quầng sáng nhẹ sau logo cho logo gold nổi trên nền marble sáng */
  .intro-glow{
    position:absolute; z-index:1; width:70vmin; height:70vmin;
    background:radial-gradient(circle, rgba(255,253,248,.85) 0%, rgba(255,253,248,.4) 40%, rgba(255,253,248,0) 70%);
    pointer-events:none;
  }
  .intro-page.hide{
    z-index:-1; visibility:hidden; opacity:0;
    transition:.4s linear;
  }

  /* ---- 2 nét cong trang trí trên/dưới ---- */
  .intro-top,.intro-bot{position:absolute; width:100%; height:auto}
  .intro-top svg,.intro-bot svg{width:100%; height:auto}
  .intro-top{left:0; top:0; transform:translate(-60%,-42%)}
  .intro-top svg{transform:scaleX(-1) rotate(15deg)}
  .intro-bot{left:0; bottom:0}

  .intro-line-top{animation:drawTop 1s linear 0s 1 normal forwards}
  .intro-line-bot{animation:drawBot 1s linear 0s 1 normal forwards}
  @keyframes drawTop{100%{stroke-dasharray:1699,1699}}
  @keyframes drawBot{100%{stroke-dasharray:1699,1699}}

  /* ---- logo giữa màn ---- */
  .intro-logo{
    position:relative; z-index:2;
    width:90%; max-width:440px;   /* logo ngang tỉ lệ ~3.3:1 nên để rộng hơn bản gốc */
    opacity:0;
    animation:logoIn .8s linear .6s 1 normal forwards;
  }
  .intro-logo img{width:100%; height:auto; display:block}
  @keyframes logoIn{
    0%{opacity:0; transform:scale(.9)}
    100%{opacity:1; transform:scale(1)}
  }

  /* ---- PLACEHOLDER logo (xoá khi có logo thật) ---- */
  .logo-placeholder{
    text-align:center; color:#fff;
    font-family:'Playfair Display','Times New Roman',serif;
    letter-spacing:2px; line-height:1.3;
  }
  .logo-placeholder .mark{font-size:34px; font-weight:700}
  .logo-placeholder .sub{
    font-size:11px; letter-spacing:5px; margin-top:6px;
    opacity:.85; font-family:'Segoe UI',sans-serif;
  }
  .logo-placeholder .rule{
    width:60px; height:1px; background:rgba(255,255,255,.6);
    margin:12px auto 0;
  }

  /* ---- nội dung trang bên dưới (demo) ---- */
  .page-demo{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    color:#fff; background:#12271d; text-align:center; padding:24px;
  }
  .page-demo h1{font-weight:400; letter-spacing:1px}
  .replay{
    margin-top:20px; padding:10px 22px; cursor:pointer;
    background:transparent; border:1px solid rgba(255,255,255,.5);
    color:#fff; border-radius:30px; letter-spacing:1px;
  }
</style>
</head>
<body>

  <!-- ========= MÀN INTRO ========= -->
  <div class="intro-page" id="introPage">
    <div class="intro-top">
      <svg width="1440" height="354" viewBox="0 0 1440 354" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path class="intro-line-top" stroke-dasharray="0, 1699"
          d="M1440 82.5456C1359.03 13.1249 1137.8 -76.2421 900.696 121.656C604.311 369.028 244.548 488.11 -74 115.706"
          stroke="var(--intro-line)" stroke-opacity="0.4"></path>
      </svg>
    </div>

    <div class="intro-glow"></div>

    <div class="intro-logo">
      <img src="assets/logo-pgbl.png" alt="Phú Gia Bảo Lộc">
    </div>

    <div class="intro-bot">
      <svg width="1440" height="354" viewBox="0 0 1440 354" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path class="intro-line-bot" stroke-dasharray="0, 1699"
          d="M1440 82.5456C1359.03 13.1249 1137.8 -76.2421 900.696 121.656C604.311 369.028 244.548 488.11 -74 115.706"
          stroke="var(--intro-line)" stroke-opacity="0.4"></path>
      </svg>
    </div>
  </div>

  <!-- ========= NỘI DUNG TRANG (demo, thay bằng tour/web PGBL) ========= -->
  <div class="page-demo">
    <div>
      <h1>Phú Gia Bảo Lộc</h1>
      <p style="opacity:.7;margin-top:10px">Trang chính nằm ở đây (tour 360 / web PGBL)</p>
      <button class="replay" onclick="playIntro()">▶ Xem lại intro</button>
    </div>
  </div>

<script>
  /* Ẩn intro sau khi trang load + giữ ~2.4s cho animation chạy hết.
     Chỉnh HOLD nếu muốn intro lâu/nhanh hơn. */
  var HOLD = 2400;
  function hideIntro(){ document.getElementById('introPage').classList.add('hide'); }
  function playIntro(){
    var el = document.getElementById('introPage');
    el.classList.remove('hide');
    // reset animation
    el.querySelectorAll('.intro-line-top,.intro-line-bot,.intro-logo').forEach(function(n){
      n.style.animation='none'; void n.offsetWidth; n.style.animation='';
    });
    setTimeout(hideIntro, HOLD);
  }
  window.addEventListener('load', function(){ setTimeout(hideIntro, HOLD); });
</script>

</body>
</html>
