<script>

	['nha-tho','Nhà thờ',       ['nha tho','giao xu','chua','thanh duong','dinh ']],
	['san-bay','Sân bay',       ['san bay','lien khuong','airport']],
	['ngan-hang','Ngân hàng',   ['ngan hang','bank','atm','agribank','vietcombank','bidv']],
	['ca-phe','Cà phê',         ['ca phe','cafe','coffee','lamb']],
	['cong-vien','Công viên',   ['cong vien','vuon','cay xanh','ho ','rung','thong']],
	['nui-deo','Núi / đèo',     ['nui','deo','doi','dai binh']],
	['cay-xang','Cây xăng',     ['xang','petrol','gas']],
	['nha-hang','Nhà hàng',     ['nha hang','quan an','am thuc','food','buffet']],
	['the-thao','Thể thao',     ['the thao','gym','san ','pickleball','bong','tennis','ho boi','lalapool','vui choi']],
	['ben-xe','Bến xe',         ['ben xe','xe bus','xe khach','tram xe']],
	['nha-mau','Nhà mẫu',       ['nha mau','sales gallery','nha dieu hanh','khu ']],
	['mac-dinh','Mặc định',     []]
];
function eraNoDau(s){
	return String(s||'').toLowerCase()
		.replace(/[àáạảãâầấậẩẫăằắặẳẵ]/g,'a').replace(/[èéẹẻẽêềếệểễ]/g,'e')
		.replace(/[ìíịỉĩ]/g,'i').replace(/[òóọỏõôồốộổỗơờớợởỡ]/g,'o')
		.replace(/[ùúụủũưừứựửữ]/g,'u').replace(/[ỳýỵỷỹ]/g,'y').replace(/đ/g,'d');
}
window.eraIconFor = function(name){
	var t = eraNoDau(name);
	for(var i=0;i<window.ERA_ICONS.length;i++){
		var kw = window.ERA_ICONS[i][2];
		for(var j=0;j<kw.length;j++){ if(t.indexOf(kw[j])>=0) return window.ERA_ICONS[i][0]; }
	}
	return 'mac-dinh';
};

window.eraPoiSave = function(scene, data){ try{ localStorage.setItem('erapoi_'+scene, data||''); localStorage.setItem('erapoiver_'+scene, window.ERA_POI_DATA_VER); }catch(e){} };
window.eraPoiClearDraft = function(scene){ try{ localStorage.removeItem('erapoi_'+scene); }catch(e){} };
window.eraPoiRestore = function(scene){
	var k=document.getElementById('krpanoSWFObject'); if(!k) return;
	var s=''; try{ s=localStorage.getItem('erapoi_'+scene)||''; }catch(e){}
	// nhap cu hon data file -> vut di, dung data trong XML
	try{ if(s && localStorage.getItem('erapoiver_'+scene) !== window.ERA_POI_DATA_VER){
			localStorage.removeItem('erapoi_'+scene); localStorage.removeItem('erapoiver_'+scene); s='';
			console.log('[ERA POI] Bo nhap cu, nap data file cho', scene);
	} }catch(e){}
	if(s){
		var cnt=0;
		s.split('###').forEach(function(line){
			if(!line) return; var p=line.split('|'); if(p.length<5) return;
			// p[5] = loai ('h' ngang | 'v' doc)  ·  p[6] = cao coc px
			// draft cu chi co 5 truong -> mac dinh ngang, coc default
			var kind = ('vrpc'.indexOf(p[5])>=0 && p[5]) ? p[5] : 'h';
			var pole = parseInt(p[6],10); if(!isFinite(pole)||pole<20) pole = (kind==='v'?110:44);
			// p[7]=rotate2D · p[8]=rx · p[9]=ry · p[10]=rz · p[11]=co chu (scale)
			function nm(i,d){ var v=parseFloat(p[i]); return isFinite(v)?v:d; }
			var rot=nm(7,0), rx=nm(8,0), ry=nm(9,0), rz=nm(10,0), sc=nm(11,1);
			if(sc<0.4||sc>4) sc=1;
			// p[12]=mau chu '#RRGGBB' · p[13]=mau nen 0xRRGGBB · p[14]=do mo nen · p[15]=mau cham
			// LUU Y: bg/dot truyen dang literal 0xRRGGBB KHONG co nhay -> krpano tu parse ra so
			var fg  = /^#[0-9a-fA-F]{6}$/.test(p[12]||'') ? p[12] : '#FFFFFF';
			// 11/08: nhan duong doi sang kieu E (chip do + bien navy) -> nen navy DAC
			var bg  = /^0x[0-9a-fA-F]{6}$/.test(p[13]||'') ? p[13] : '0x0C0C44';
			var bga = nm(14, kind==='r'?1:(kind==='v'?0.85:0.80));
			var dot = /^0x[0-9a-fA-F]{6}$/.test(p[15]||'') ? p[15] : '0xC8102E';
			// 17..21 = icon | w | w2 | gc | bear
			var ico = (p[17]&&p[17].length>2) ? p[17] : (kind==='h' ? window.eraIconFor(p[2]) : 'mac-dinh');
			var w   = nm(18, kind==='p'?210:0), w2 = nm(19,70), gc = nm(20, kind==='r'?26:24), bear = nm(21, parseFloat(p[0])||0);
			// loai 'r' DUNG LAI truong sub (p[3]) lam chu trong CHIP DO — khong them truong nhap moi
			var chip = (p[3]||'').trim() || 'Đường';
			// distorted=true lam MAT CHU voi text hotspot (krpano 1.19) -> luon ep false
			if(kind==='v')      k.call("add_poi_v("+p[0]+","+p[1]+",'"+p[2]+"',"+pole+","+sc+",'"+fg+"',"+bg+","+bga+","+dot+")");
			else if(kind==='r') k.call("add_poi_r("+p[0]+","+p[1]+",'"+p[2]+"',"+rot+",0,0,0,"+sc+",'"+fg+"',"+bg+","+bga+","+dot+",false,"+w+","+gc+",'"+chip+"')");
			else if(kind==='p') k.call("add_poi_p("+p[0]+","+p[1]+",'"+p[2]+"','"+p[4]+"',"+pole+","+sc+",'"+fg+"',"+bg+","+bga+","+dot+","+w+","+w2+")");
			else if(kind==='c') k.call("add_poi_c("+p[0]+","+p[1]+",'"+p[2]+"','"+p[3]+"','"+p[4]+"',"+bear+","+pole+","+sc+",'"+fg+"',"+bg+","+bga+","+dot+")");
			else                k.call("add_poi("+p[0]+","+p[1]+",'"+p[2]+"','"+p[3]+"','"+p[4]+"',"+pole+","+sc+",'"+fg+"',"+bg+","+bga+","+dot+",'"+ico+"',"+w+")");
			cnt++;
		});
		k.set('poi_count', cnt);
	} else {
		if(scene==='scene_01-tong-the') k.call('era_poi_data_01()');
		else if(scene==='scene_02-toan-canh') k.call('era_poi_data_02()');
		else if(scene==='scene_03-view-nui') k.call('era_poi_data_03()');
		// 11/08 (toi): bat POI cho scene "Ma lo tren flycam" — 24 diem chep tu
		// data_02 lam moc, con phai xoay theo do lech (xem chu thich trong XML).
		else if(scene==='scene_matbang_flycam') k.call('era_poi_data_04()');
	}
	// tat chu "loading..." cua skin (pr16 khong ban onloadcomplete de tu tat)
	setTimeout(window.eraHideLoading, 2500);
	setTimeout(window.eraHideLoading, 7000);
};

/* ============================================================
   TAT CHU "loading..." KET GIUA TROI   (11/08 — da tim ra goc)
   Trieu chung: 1 chu "loading..." Arial in nghieng 22px dung yen giua
   khung hinh, khong bam duoc, Ctrl+Shift+R cung khong het.
   🔴 GOC: KHONG phai hotspot POI, ma la layer 'skin_loadingtext' cua
      skin/vtourskin.xml (dong 369). Skin BAT no o onnewpano va chi TAT o
      onloadcomplete — ma krpano 1.19-pr16 KHONG BAN onloadcomplete
      (chinh la ly do man intro 3D phai co hard fallback 7s tu 07/08).
      Khong bao gio tat -> chu ket vinh vien.
   Sua ADDITIVE: tu tat layer do sau khi nap xong. KHONG sua vtourskin.xml
   (quy tac cung so 3 trong CLAUDE.md).
   ============================================================ */
window.eraHideLoading = function(){
	var k=document.getElementById('krpanoSWFObject'); if(!k) return false;
	try{
		if(k.get('layer[skin_loadingtext].visible') === false) return false;
		k.set('layer[skin_loadingtext].visible', false);
		console.log('[ERA] Da tat skin_loadingtext (krpano pr16 khong ban onloadcomplete)');
		return true;
	}catch(e){ return false; }
};

/* ============================================================
   BANG BAT/TAT LOP CHI BAO — hen gio ap lai trang thai
   Goi tu era-layers-360.xml:  js( eraLayersKick() )
   ------------------------------------------------------------
   🔴 12/08 — TAI SAO PHAI HEN GIO BANG JS CHU KHONG DUNG delayedcall:
   Trong krpano 1.19-pr16, `era_layers_apply()` chay TU delayedcall thi
   VONG LAP `for(... i LT hotspot.count ...)` KHONG CHAY LAN NAO —
   `hotspot.count` doc ra rong trong pham vi cua delayedcall, nen bo dem
   dung nguyen o 0. Goi thang thi dung (dem ra 35). Dang 3 tham so
   `delayedcall(id, giay, lenh)` con te hon: khong bao gio ban.
   Ca hai deu IM LANG, khong console do. => Hen gio bang setTimeout ben JS,
   giong cach eraHideLoading da lam o tren.

   Vi sao can 3 moc: nhan POI va gim lo duoc dung LAI sau moi lan doi scene,
   mot so nhan ve muon (eraPoiRestore co moc 2.5s va 7s). Ap 1 lan la khong du —
   nhan ve sau se hien lai du Anh Tony da tat lop do.
   ============================================================ */
window.eraLayersKick = function(){
	[900, 3200, 7800].forEach(function(ms){
		setTimeout(function(){
			var k = document.getElementById('krpanoSWFObject'); if(!k) return;
			try{ k.call('era_layers_apply()'); }catch(e){}
		}, ms);
	});
	// 🔴 krpano 1.19 chi VE LAI MAN khi co doi tam nhin. Nguoi xem chua cham
	// chuot thi bang nay dung do khong hien (da chup man kiem chung: bang co
	// that, visible=true, nhung khong duoc ve). Nhich fov 0,5% roi tra ve
	// nguyen gia tri -> ep ve 1 khung. Nhich 0,01% thi krpano lo di.
	// Cung cach da dung o trang tien ich (eraFirstPaint), xem nhat ky 11/08 toi-5.
	// 🔴 CHI CHAY 1 LAN. eraLayersKick duoc goi 2 lan (onxmlcomplete + onnewpano);
	// khong khoa lai thi 2 cu nhich chong len nhau, cu sau chup phai gia tri da
	// bi nhich cua cu truoc -> fov tra ve 99.0 thay vi 100 (do that: 100 -> 99.0025).
	if(!window._eraLayPaintDone){
		window._eraLayPaintDone = true;
		setTimeout(function(){
			var k = document.getElementById('krpanoSWFObject'); if(!k) return;
			try{
				var f = parseFloat(k.get('view.fov'));
				if(!isFinite(f) || f <= 0) return;
				k.set('view.fov', f * 0.995);
				setTimeout(function(){ try{ k.set('view.fov', f); }catch(e){} }, 300);
			}catch(e){}
		}, 1300);
	}
};

// form nhap diem (goi tu era-poi-360.xml khi click dat diem)
window.eraPoiPin = function(ath, atv, kind){
	kind = (kind==='v'||kind==='r'||kind==='p'||kind==='c') ? kind : 'h';   // 'h' ngang · 'v' doc · 'r' nhan duong
	ath = Math.round(parseFloat(ath)*10)/10; atv = Math.round(parseFloat(atv)*10)/10;
	if(!isFinite(ath)||!isFinite(atv)){ alert('Chưa lấy được vị trí — bấm THÊM ĐIỂM rồi click lại lên ảnh.'); return; }
	function esc(s){ return String(s||'').replace(/['",]/g,' ').trim(); }
	var box = document.getElementById('era-poi-input');
	if(!box){ box=document.createElement('div'); box.id='era-poi-input'; document.body.appendChild(box); }
	box.style.cssText='position:fixed;z-index:99999;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,92vw);background:#0C0C44;color:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.5);padding:18px;font-family:Arial;';
	var isV = (kind==='v'), isR = (kind==='r'), isP = (kind==='p'), isC = (kind==='c');
	var inpCss = "width:100%;box-sizing:border-box;margin-bottom:8px;padding:9px;border-radius:8px;border:0;font-size:13px;";
	var head = isR ? "Thêm BIỂN TÊN ĐƯỜNG"
	         : isV ? "Thêm nhãn DỌC (núi / cầu)"
	         : isP ? "Thêm CHIP SỐ (mốc xa)"
	         : isC ? "Thêm LA BÀN HƯỚNG"
	         :       "Thêm THẺ TIỆN ÍCH (icon tròn)";
	var ph   = isR ? "Tên tuyến, KHÔNG kèm chữ Đường (vd: Xuân Diệu)"
	         : isV ? "Tên (vd: NÚI ĐẠI BÌNH)"
	         : isP ? "Tên (vd: SÂN BAY LIÊN KHƯƠNG)"
	         : isC ? "Tên mốc (vd: TP. BẢO LỘC)"
	         :       "Tên (vd: Co.opmart Bảo Lộc)";
	box.innerHTML =
		"<div style='font-weight:bold;margin-bottom:4px;'>"+head+"</div>"
		+"<div style='font-size:11px;color:#9fb0c4;margin-bottom:12px;'>vị trí ath "+ath+" · atv "+atv+"</div>"
		+"<input id='epi-title' placeholder='"+ph+"' style='"+inpCss+"'/>"
		+ (isR ? "<input id='epi-sub' value='Đường' placeholder='Chữ trong chip đỏ (vd: QL20)' style='"+inpCss+"'/>" : "")
		+ (isP ? "<input id='epi-dist' placeholder='Số hiện trong chip (vd: 58 km)' style='"+inpCss+"'/>" : "")
		+ (isC ? "<input id='epi-sub' placeholder='Hướng (vd: Tây Nam)' style='"+inpCss+"'/>"
				+"<input id='epi-dist' placeholder='Khoảng cách (vd: 9 km)' style='"+inpCss+"'/>" : "")
		+ ((isV||isR||isP||isC) ? "" :
			 "<input id='epi-sub' placeholder='Mô tả (vd: Siêu thị)' style='"+inpCss+"'/>"
			+"<input id='epi-dist' placeholder='Khoảng cách (vd: 5 KM)' style='"+inpCss+"'/>")
		+ ((isP||isC) ? "" : isR
			? "<input id='epi-rot' type='number' min='-180' max='180' step='5' value='0' "
				+"placeholder='Góc xoay (độ)' style='"+inpCss+"margin-bottom:6px;'/>"
			 +"<div style='font-size:11px;color:#9fb0c4;margin-bottom:12px;'>Góc xoay — 0 là nằm ngang. "
				+"Đường chạy xuống bên phải thì góc DƯƠNG, chạy lên bên phải thì góc ÂM. "
				+"Cứ để 0 rồi vào tour bấm XOAY +/− canh cho khớp mặt đường.</div>"
			: "<input id='epi-pole' type='number' min='20' max='400' step='6' value='"+(isV?110:44)+"' "
				+"placeholder='Cao cọc (px)' style='"+inpCss+"margin-bottom:6px;'/>"
			 +"<div style='font-size:11px;color:#9fb0c4;margin-bottom:12px;'>Cao cọc — 2 bảng gần nhau thì cho "
				+"cái cọc cao, cái cọc thấp là hết đè. Sau vẫn sửa được bằng nút COC +/− trong tour.</div>")
		+"<div style='display:flex;gap:8px;'>"
		+"<button id='epi-ok' style='flex:1;background:#1B9E5A;color:#fff;border:0;border-radius:8px;padding:11px;font-weight:bold;cursor:pointer;'>"
			+ (isR ? "Thêm nhãn đường" : isV ? "Thêm nhãn dọc" : isP ? "Thêm chip số" : isC ? "Thêm la bàn" : "Thêm thẻ") + "</button>"
		+"<button id='epi-cancel' style='flex:0 0 84px;background:#555;color:#fff;border:0;border-radius:8px;padding:11px;cursor:pointer;'>Huỷ</button>"
		+"</div>";
	box.style.display='block';
	var ti=document.getElementById('epi-title'); ti.focus();
	function val(id){ var e=document.getElementById(id); return e ? e.value : ''; }
	function submit(){
		var title=esc(val('epi-title'))||'DIEM MOI';
		var k=document.getElementById('krpanoSWFObject');
		if(isR){
			var rot=parseFloat(val('epi-rot')); if(!isFinite(rot)) rot=0;
			if(rot>180) rot=180; if(rot<-180) rot=-180;
			var chip = esc(val('epi-sub')) || 'Đường';
			k.call("add_poi_r("+ath+","+atv+",'"+title+"',"+rot+",0,0,0,1,'#FFFFFF',0x0C0C44,1,0xC8102E,false,200,26,'"+chip+"')");
		} else if(isP){
			k.call("add_poi_p("+ath+","+atv+",'"+title+"','"+esc(val('epi-dist'))+"',52,1,'#FFFFFF',0x0C0C44,0.85,0xC8102E,210,70)");
		} else if(isC){
			// huong mac dinh = ath cua diem Anh vua click (click ve phia moc)
			k.call("add_poi_c("+ath+","+atv+",'"+title+"','"+esc(val('epi-sub'))+"','"+esc(val('epi-dist'))+"',"+ath+",44,1,'#FFFFFF',0x0C0C44,0,0xC8102E)");
		} else {
			var pole=parseInt(val('epi-pole'),10); if(!isFinite(pole)||pole<20) pole=(isV?110:44);
			if(pole>400) pole=400;
			if(isV){
				k.call("add_poi_v("+ath+","+atv+",'"+title+"',"+pole+")");
			} else {
				var sub=esc(val('epi-sub')), dist=esc(val('epi-dist'));
				// icon TU CHON theo tu khoa trong ten (truong / benh vien / sieu thi / nha tho ...)
				var ico = window.eraIconFor(title);
				k.call("add_poi("+ath+","+atv+",'"+title+"','"+sub+"','"+dist+"',"+pole+",1,'#FFFFFF',0x0C0C44,0.85,0xC8102E,'"+ico+"',230)");
			}
		}
		k.call("poi_save_draft()");
		box.style.display='none';
		// mo ngay BANG DIEU KHIEN cho nhan vua them
		var ni = parseInt(k.get('poi_count'),10) - 1;
		if(isFinite(ni) && ni>=0) setTimeout(function(){ eraPoiPanel(ni); }, 60);
	}
	document.getElementById('epi-ok').onclick=submit;
	var lastInp = document.getElementById(isR ? 'epi-rot' : (isP||isC) ? 'epi-dist' : 'epi-pole');
	if(lastInp) lastInp.onkeydown=function(e){ if(e.key==='Enter') submit(); };
	document.getElementById('epi-cancel').onclick=function(){ box.style.display='none'; };
};

function eraK(){ return document.getElementById('krpanoSWFObject'); }
function eraHS(i){ return "hotspot[poi_board_"+i+"]"; }
function eraGet(i,p){ var k=eraK(); return k ? k.get(eraHS(i)+"."+p) : null; }
function eraSet(i,p,v){ var k=eraK(); if(k) k.set(eraHS(i)+"."+p, v); }
function eraNum(v,d){ var n=parseFloat(v); return isFinite(n)?n:d; }

function eraPoiSaveSoon(){
	clearTimeout(window.__eraPoiSaveTimer);
	window.__eraPoiSaveTimer = setTimeout(function(){
		var k=eraK(); if(k) k.call("poi_save_draft()");
	}, 400);
}

window.eraPoiPanelClose = function(){
	var b=document.getElementById('era-poi-panel'); if(b) b.style.display='none';
	window.__eraPoiIdx = -1;
};

window.eraPoiPanel = function(idx){
	idx = parseInt(idx,10); if(!isFinite(idx)||idx<0) return;
	var k=eraK(); if(!k) return;
	window.__eraPoiIdx = idx;

	var type  = String(eraGet(idx,'p_type')||'h');
	var title = String(eraGet(idx,'p_title')||'');
	var sub   = String(eraGet(idx,'p_sub')||'');
	var dist  = String(eraGet(idx,'p_dist')||'');
	var pole  = eraNum(eraGet(idx,'p_pole'), type==='v'?110:44);
	var scale = eraNum(eraGet(idx,'p_scale'), 1);
	var rot   = eraNum(eraGet(idx,'p_rot'), type==='v'?-90:0);
	var rx    = eraNum(eraGet(idx,'p_rx'), 0);
	var ry    = eraNum(eraGet(idx,'p_ry'), 0);
	var rz    = eraNum(eraGet(idx,'p_rz'), 0);

	var icon  = String(eraGet(idx,'p_icon')||'');
	var w     = eraNum(eraGet(idx,'p_w'), 0);
	var w2    = eraNum(eraGet(idx,'p_w2'), 70);
	var gc    = eraNum(eraGet(idx,'p_gc'), 56);
	var bear  = eraNum(eraGet(idx,'p_bear'), 0);
	var isR=(type==='r'), isV=(type==='v'), isP=(type==='p'), isC=(type==='c');
	var tenLoai = isR ? 'BIỂN TÊN ĐƯỜNG · chip đỏ'
	            : isV ? 'NHÃN DỌC'
	            : isP ? 'CHIP SỐ · mốc xa'
	            : isC ? 'LA BÀN HƯỚNG'
	            :       'THẺ TIỆN ÍCH · icon tròn';

	var box=document.getElementById('era-poi-panel');
	if(!box){ box=document.createElement('div'); box.id='era-poi-panel'; document.body.appendChild(box); }
	box.style.cssText='position:fixed;z-index:99997;left:14px;top:104px;width:302px;'
		+'max-height:74vh;overflow-y:auto;background:rgba(12,12,68,.94);color:#fff;'
		+'border:1px solid rgba(255,255,255,.22);border-radius:12px;'
		+'box-shadow:0 10px 34px rgba(0,0,0,.55);padding:13px 14px;'
		+'font-family:Arial,sans-serif;font-size:12px;';

	function row(id,label,min,max,step,val,unit){
		return "<div style='margin-bottom:9px;'>"
		 +"<div style='display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;'>"
		 +"<span style='color:#BAD8C3;'>"+label+"</span>"
		 +"<b id='"+id+"-v' style='color:#7ADD8B;'>"+val+(unit||"")+"</b></div>"
		 +"<input id='"+id+"' type='range' min='"+min+"' max='"+max+"' step='"+step+"' value='"+val+"' "
		 +"style='width:100%;margin:0;'/></div>";
	}
/* ---- bang mau: 6 preset + 3 picker + do mo nen ---- */
	/* ---- luoi chon ICON (chi the tien ich) ---- */
	function iconUI(){
		var out = "<div style='margin-bottom:9px;'><div style='color:#BAD8C3;margin-bottom:5px;'>Icon — bấm 1 ô là đổi ngay</div>"
			+"<div style='display:flex;flex-wrap:wrap;gap:5px;'>";
		for(var i=0;i<window.ERA_ICONS.length;i++){
			var id=window.ERA_ICONS[i][0], ten=window.ERA_ICONS[i][1], on=(id===icon);
			out += "<button class='ep-ic' data-id='"+id+"' title='"+ten+"' "
				+"style='flex:0 0 auto;width:38px;height:38px;padding:3px;cursor:pointer;"
				+"background:"+(on?'rgba(122,221,139,.22)':'transparent')+";"
				+"border:1px solid "+(on?'#7ADD8B':'rgba(255,255,255,.28)')+";border-radius:8px;'>"
				+"<img src='poi-icons/"+id+".png' style='width:100%;height:100%;display:block;'/></button>";
		}
		return out+"</div></div>";
	}

	function sw(fg,bg,a,ten){
		return "<button class='ep-pre' data-fg='"+fg+"' data-bg='"+bg+"' data-a='"+a+"' title='"+ten+"' "
		 +"style='flex:1 1 30%;min-width:0;background:"+(a>0?bg:'transparent')+";color:"+fg+";"
		 +"border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:7px 2px;cursor:pointer;"
		 +"font-family:inherit;font-size:10px;font-weight:bold;white-space:nowrap;overflow:hidden;'>"+ten+"</button>";
	}
	function pick(id,label,val){
		return "<div style='flex:1;min-width:0;'><div style='color:#BAD8C3;font-size:10px;margin-bottom:3px;'>"+label+"</div>"
		 +"<input id='"+id+"' type='color' value='"+val+"' style='width:100%;height:28px;padding:0;border:0;border-radius:5px;background:none;cursor:pointer;'/></div>";
	}
	function mauUI(){
		var bgHex = '#' + String(eraGet(idx,'p_bg')||'0x0C0C44').replace(/^0x/i,'');
		var dtHex = '#' + String(eraGet(idx,'p_dot')||'0xC8102E').replace(/^0x/i,'');
		var bga   = eraNum(eraGet(idx,'p_bga'), isR?0:0.8);
		var fgHex = String(eraGet(idx,'p_fg')||'#FFFFFF');
		return "<div style='border-top:1px solid rgba(255,255,255,.16);margin:11px 0 9px;padding-top:10px;'>"
		 +"<div style='color:#BAD8C3;margin-bottom:6px;'>Bảng màu — bấm 1 ô là ăn ngay</div>"
		 +"<div style='display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px;'>"
		 + sw('#F2D57E','#1B6E3C',0.92,'Lá đậm')
		 + sw('#FFFFFF','#0C0C44',0.85,'Navy ERA')
		 + sw('#FFFFFF','#C8102E',0.90,'Đỏ ERA')
		 + sw('#0C0C44','#FFFFFF',0.92,'Trắng')
		 + sw('#FFFFFF','#D6249F',0.90,'Magenta')
		 + sw('#FFFFFF','#000000',0.00,'Không nền')
		 +"</div>"
		 +"<div style='display:flex;gap:7px;margin-bottom:9px;'>"
		 + pick('ep-fg','Chữ', fgHex) + pick('ep-bg','Nền', bgHex)
		 + pick('ep-dot', isR ? 'Chip đỏ/cột' : 'Chấm/cọc', dtHex)
		 +"</div>"
		 +"<div style='display:flex;justify-content:space-between;margin-bottom:3px;'>"
		 +"<span style='color:#BAD8C3;'>Độ mờ nền</span><b id='ep-bga-v' style='color:#7ADD8B;'>"+bga+"</b></div>"
		 +"<input id='ep-bga' type='range' min='0' max='1' step='0.05' value='"+bga+"' style='width:100%;margin:0;'/>"
		 +"</div>";
	}

	function txt(id,label,val,ph){
		return "<div style='margin-bottom:9px;'>"
		 +"<div style='color:#BAD8C3;margin-bottom:3px;'>"+label+"</div>"
		 +"<input id='"+id+"' type='text' value=\""+String(val).replace(/"/g,'&quot;')+"\" placeholder='"+(ph||"")+"' "
		 +"style='width:100%;box-sizing:border-box;padding:7px;border:0;border-radius:6px;font-size:12px;'/></div>";
	}

	box.innerHTML =
		"<div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;'>"
		 +"<b style='font-size:13px;'>"+tenLoai+" #"+idx+"</b>"
		 +"<span style='cursor:pointer;font-size:20px;line-height:1;padding:0 4px;' onclick='eraPoiPanelClose()'>&times;</span></div>"
		+"<div style='color:#8fa3b8;font-size:10px;margin-bottom:11px;'>Kéo slider — chữ đổi ngay trên ảnh</div>"

		+ txt('ep-title','Tên', title, 'Tên nhãn')
		+ (isR ? txt('ep-sub','Chữ trong chip đỏ', sub, 'vd: QL20 / Đường') : "")
		+ (isP ? txt('ep-dist','Số trong chip', dist, 'vd: 58 km') : "")
		+ (isC ? txt('ep-sub','Hướng', sub, 'vd: Tây Nam') + txt('ep-dist','Khoảng cách', dist, 'vd: 9 km') : "")
		+ (isR||isV||isP||isC ? "" : txt('ep-sub','Mô tả', sub, 'vd: Siêu thị') + txt('ep-dist','Khoảng cách', dist, 'vd: 5 KM'))

		+ (type==='h' ? iconUI() : "")
		

		+ row('ep-scale','Cỡ chữ', 0.4, 4, 0.05, scale, 'x')
		+ (isR
			? row('ep-rot','Xoay phẳng — canh theo hướng đường', -180, 180, 1, rot, '°')
			 +row('ep-gc','Cao cột biển', 0, 220, 2, gc, 'px')
			: isC
			? row('ep-bear','Hướng kim (0 = Bắc)', -180, 180, 1, bear, '°')
			 +row('ep-pole','Cao cọc', 20, 400, 2, pole, 'px')
			: isP
			? row('ep-w','Rộng tối đa pill tên', 80, 460, 4, w, 'px')
			 +row('ep-w2','Rộng chip số', 40, 200, 2, w2, 'px')
			 +row('ep-pole','Cao cọc', 20, 400, 2, pole, 'px')
			: type==='h'
			? row('ep-w','Rộng tối đa (0 = tự co theo chữ)', 0, 460, 10, w, 'px')
			 +row('ep-pole','Cao cọc', 20, 400, 2, pole, 'px')
			: row('ep-pole','Cao cọc', 20, 400, 2, pole, 'px'))

		+ mauUI()
		+"<div style='display:flex;gap:7px;margin-top:12px;'>"
		 +"<button id='ep-reset' style='flex:1;background:#3a3a6b;color:#fff;border:0;border-radius:7px;padding:9px;cursor:pointer;font-family:inherit;font-size:11px;'>Về mặc định</button>"
		 +"<button id='ep-del' style='flex:1;background:#8A1020;color:#fff;border:0;border-radius:7px;padding:9px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:bold;'>Xoá nhãn này</button>"
		+"</div>";
	box.style.display='block';

	/* ---- ap thay doi ngay lap tuc ---- */
	// dong bo o color picker + 6 preset
	var epC = document.getElementById('ep-fg'), epB = document.getElementById('ep-bg'),
	    epD = document.getElementById('ep-dot'), epA = document.getElementById('ep-bga');
	function applyFg(hex){
		var kk=eraK(); if(!kk) return;
		kk.call("poi_set_fg("+idx+",'"+hex+"')");  // css chu: dinh nghia 1 cho trong XML
		// hotspot phu (icon / chip / kim) doi mau chu theo — css dung font rieng nen set thang
		if(type==='h') kk.set("hotspot[poi_a_"+idx+"].css", 'color:'+hex+'; font-family:"Phosphor-Light"; font-size:19px; text-align:center;');
		if(type==='p') kk.set("hotspot[poi_a_"+idx+"].css", 'color:'+hex+'; font-family:Inter, Arial, sans-serif; font-size:13px; font-weight:700; text-align:center;');
		// 🔴 type 'c': KHONG set css cho poi_b_ — no la hotspot ANH (mui-ten.png).
		// Set css se bien no thanh text hotspot va mat hinh kim.
		eraPoiSaveSoon();
	}
	function applyBg(hex, alpha){
		eraSet(idx,'bgcolor', parseInt(hex.slice(1),16));
		eraSet(idx,'p_bg', '0x'+hex.slice(1).toUpperCase());
		if(alpha!==undefined){ eraSet(idx,'bgalpha', alpha); eraSet(idx,'p_bga', alpha); }
		eraPoiSaveSoon();
	}
	function applyDot(hex){
		var kk=eraK(); if(!kk) return;
		var n=parseInt(hex.slice(1),16);
		kk.set("hotspot[poi_dot_"+idx+"].bgcolor", n);
		kk.set("hotspot[poi_pole_"+idx+"].bgcolor", n);
		// loai 'r': mau nay dieu khien CHIP DO + cot bien + cham neo
		if(type==='r'){
			kk.set("hotspot[poi_a_"+idx+"].bgcolor", n);
			kk.set("hotspot[poi_b_"+idx+"].bgcolor", n);
		}
		eraSet(idx,'p_dot', '0x'+hex.slice(1).toUpperCase());
		eraPoiSaveSoon();
	}
	if(epC) epC.oninput=function(){ applyFg(epC.value); };
	if(epB) epB.oninput=function(){ applyBg(epB.value); };
	if(epD) epD.oninput=function(){ applyDot(epD.value); };
	if(epA) epA.oninput=function(){
		var v=parseFloat(epA.value);
		document.getElementById('ep-bga-v').innerText = v;
		eraSet(idx,'bgalpha', v); eraSet(idx,'p_bga', v); eraPoiSaveSoon();
	};
	Array.prototype.forEach.call(document.querySelectorAll('#era-poi-panel .ep-pre'), function(b){
		b.onclick=function(){
			var fg=b.getAttribute('data-fg'), bg=b.getAttribute('data-bg'), a=parseFloat(b.getAttribute('data-a'));
			if(epC) epC.value=fg;  applyFg(fg);
			if(epB) epB.value=bg;
			if(epA){ epA.value=a; document.getElementById('ep-bga-v').innerText=a; }
			applyBg(bg, a);
		};
	});

	function setHtml(){
		var t=document.getElementById('ep-title').value;
		eraSet(idx,'p_title', t);
		if(isR){
			// loai 'r': o "Chữ trong chip đỏ" ghi vao p_sub va vao html cua poi_a_
			eraSet(idx,'html', t);
			var es=document.getElementById('ep-sub');
			var c=(es ? es.value : '').trim() || 'Đường';
			eraSet(idx,'p_sub', c);
			var kc=eraK(); if(kc) kc.set("hotspot[poi_a_"+idx+"].html", c);
		}
		else if(isV){ eraSet(idx,'html', t); }
		else {
			var s=document.getElementById('ep-sub').value, d=document.getElementById('ep-dist').value;
			eraSet(idx,'p_sub', s); eraSet(idx,'p_dist', d);
			eraSet(idx,'html', '[b]'+t+'[/b][br]'+s+'  [b]'+d+'[/b]');
		}
		eraPoiSaveSoon();
	}
	['ep-title','ep-sub','ep-dist'].forEach(function(id){
		var e=document.getElementById(id); if(e) e.oninput=setHtml;
	});

	function bind(id, unit, apply){
		var e=document.getElementById(id); if(!e) return;
		e.oninput=function(){
			var v=parseFloat(e.value);
			document.getElementById(id+'-v').innerText = v+(unit||'');
			apply(v); eraPoiSaveSoon();
		};
	}
	bind('ep-scale','x', function(v){
		eraSet(idx,'scale',v); eraSet(idx,'p_scale',v);
		var kk=eraK(); if(!kk) return;
		kk.set("hotspot[poi_a_"+idx+"].scale", v);
		kk.set("hotspot[poi_b_"+idx+"].scale", v);
	});
	// luoi icon
	Array.prototype.forEach.call(document.querySelectorAll('#era-poi-panel .ep-ic'), function(b){
		b.onclick=function(){
			var id=b.getAttribute('data-id');
			var kk=eraK(); if(kk) kk.set("hotspot[poi_a_"+idx+"].url", "poi-icons/"+id+".png");
			eraSet(idx,'p_icon', id);
			eraPoiSaveSoon(); eraPoiPanel(idx);
		};
	});
	// be rong the / gach / pill ten
	// LUU Y: voi the icon / chip so, `width` chi la BE RONG TOI DA de wrap chu.
	// Vi tri cac manh phu neo theo canh (bottomleft / bottomright) nen KHONG phu thuoc width.
	bind('ep-w','px', function(v){
		var kk=eraK(); if(!kk) return;
		eraSet(idx,'p_w', v);
		if(type==='h' || type==='p') eraSet(idx,'width', v>60 ? v : null);
		else if(type==='r')          kk.set("hotspot[poi_a_"+idx+"].width", v);
	});
	bind('ep-w2','px', function(v){
		var kk=eraK(); if(!kk) return;
		eraSet(idx,'p_w2', v);
		kk.set("hotspot[poi_a_"+idx+"].width", v);
	});
	// cao cot bien (loai 'r'): bien navy + chip do cung day len -v, cot cao dung v
	bind('ep-gc','px', function(v){
		var kk=eraK(); if(!kk) return;
		eraSet(idx,'p_gc', v);
		eraSet(idx,'oy', -v);
		kk.set("hotspot[poi_a_"+idx+"].oy", -v);
		kk.set("hotspot[poi_b_"+idx+"].height", v);
		kk.set("hotspot[poi_b_"+idx+"].visible", v>2);
	});
	// huong kim la ban
	bind('ep-bear','°', function(v){ eraSet(idx,'p_bear', v); var kk=eraK(); if(kk) kk.call('era_poi_needles()'); });
	bind('ep-rot','°',   function(v){
		eraSet(idx,'rotate',v); eraSet(idx,'p_rot',v);
		// chip do phai xoay CUNG goc voi bien ten, khong thi mach noi banh ra
		var kk=eraK(); if(kk && type==='r') kk.set("hotspot[poi_a_"+idx+"].rotate", v);
	});
	bind('ep-rx','°',    function(v){ eraSet(idx,'rx',v); eraSet(idx,'p_rx',v); });
	bind('ep-ry','°',    function(v){ eraSet(idx,'ry',v); eraSet(idx,'p_ry',v); });
	bind('ep-rz','°',    function(v){ eraSet(idx,'rz',v); eraSet(idx,'p_rz',v); });
	bind('ep-pole','px', function(v){
		var kk=eraK(); if(kk) kk.set("hotspot[poi_pole_"+idx+"].height", v);
		// nhan DOC day bang ox (offset bi xoay theo rotate), cac loai khac day bang oy
		if(isV){ eraSet(idx,'ox', v); eraSet(idx,'oy', 0); }
		else   { eraSet(idx,'oy', -v); }
		if(kk && type==='h') kk.set("hotspot[poi_a_"+idx+"].oy", -v - 5);
		if(kk && type==='p') kk.set("hotspot[poi_a_"+idx+"].oy", -v);
		if(kk && type==='c'){
			kk.set("hotspot[poi_a_"+idx+"].oy", -v - 88);
			kk.set("hotspot[poi_b_"+idx+"].oy", -v - 88);
		}
		eraSet(idx,'p_pole', v);
	});

	document.getElementById('ep-reset').onclick=function(){
		var d = isR ? {scale:1,rot:0,rx:0,ry:0,rz:0} : {scale:1,pole:(isV?110:44)};
		if(isR){
			eraSet(idx,'scale',1); eraSet(idx,'p_scale',1);
			['rotate','rx','ry','rz'].forEach(function(p){ eraSet(idx,p,0); });
			eraSet(idx,'p_rot',0); eraSet(idx,'p_rx',0); eraSet(idx,'p_ry',0); eraSet(idx,'p_rz',0);
			eraSet(idx,'distorted', false); eraSet(idx,'p_d3d', false);
		} else {
			eraSet(idx,'scale',1); eraSet(idx,'p_scale',1);
			var kk=eraK(); if(kk) kk.set("hotspot[poi_pole_"+idx+"].height", d.pole);
			if(isV){ eraSet(idx,'ox', d.pole); eraSet(idx,'oy',0); } else { eraSet(idx,'oy', -d.pole); }
			eraSet(idx,'p_pole', d.pole);
		}
		var kk2=eraK(); if(kk2) kk2.call("poi_save_draft()");
		eraPoiPanel(idx);
	};

	document.getElementById('ep-del').onclick=function(){
		if(!confirm('Xoá nhãn "'+title+'" ?')) return;
		var kk=eraK(); if(!kk) return;
		eraPoiPanelClose();
		kk.call("poi_save_draft()");
		eraPoiDelete(kk.get('xml.scene'), idx);
	};
};

/* xoa 1 nhan BAT KY: bo dong thu idx trong nhap roi nap lai ca scene
   -> khong de lo trong day so hotspot (poi_board_0,1,2...) */
window.eraPoiDelete = function(scene, idx){
	idx=parseInt(idx,10);
	var s=''; try{ s=localStorage.getItem('erapoi_'+scene)||''; }catch(e){}
	var arr = s.split('###').filter(function(x){ return x && x.length; });
	if(idx<0 || idx>=arr.length){ alert('Không tìm thấy nhãn để xoá (nháp có '+arr.length+' mục).'); return; }
	arr.splice(idx,1);
	var out = arr.length ? arr.join('###')+'###' : '';
	try{ localStorage.setItem('erapoi_'+scene, out); }catch(e){}
	var k=eraK();
	if(out===''){ // het nhap -> tranh bi nap lai data goc trong file
		try{ localStorage.setItem('erapoi_'+scene, ' '); }catch(e){}
	}
	if(k) k.call("era_poi_clear(); era_poi_build();");
};

window.eraPoiExport = function(code){
	code = String(code).split('###').join('\n');
	var box = document.getElementById('era-poi-export');
	if(!box){
		box = document.createElement('div');
		box.id = 'era-poi-export';
		box.style.cssText = 'position:fixed;z-index:99999;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);background:#0C0C44;color:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.5);padding:16px;font-family:Arial;';
		document.body.appendChild(box);
	}
	box.innerHTML =
		'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'
		+ '<b style="font-size:14px;">Toa do POI da chot &mdash; copy dan vao era-poi-360.xml</b>'
		+ '<span style="cursor:pointer;font-size:20px;padding:0 6px;" onclick="document.getElementById(\'era-poi-export\').style.display=\'none\'">&times;</span></div>'
		+ '<textarea id="era-poi-code" style="width:100%;height:190px;box-sizing:border-box;font-family:Consolas,monospace;font-size:12px;border-radius:8px;border:0;padding:10px;resize:vertical;">'
		+ code + '</textarea>'
		+ '<button onclick="var t=document.getElementById(\'era-poi-code\');t.select();document.execCommand(\'copy\');this.innerText=\'DA COPY!\';" '
		+ 'style="margin-top:10px;background:#1B9E5A;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:bold;cursor:pointer;">COPY</button>';
	box.style.display = 'block';
	var t = document.getElementById('era-poi-code'); if(t){ t.focus(); t.select(); }
};
</script>


<!-- ==================================================================
     ERA · MA LO TREN FLYCAM 360
     Cap doi voi era-lots-flycam.xml. Gom 3 phan:
       (1) Box thong tin hien khi re chuot vao gim lo
       (2) Cua so chon ma lo khi dat gim  +  luu nhap localStorage
       (3) Goi y tu dong: tu vai lo Anh da dat, suy ra vi tri cac lo con lai
     ================================================================== -->
<!-- 🔴 26/08 Anh Tony chot: TRANG THAI LO LAY TU GOOGLE SHEET, dung chung
     nguon voi /giohang/ va /banghang/. Thu tu du phong cua ERA_TT:
        Sheet  ->  assets/trang-thai-snapshot.js  ->  localStorage
     Thu tu 2 the nay giu y het ben giohang/index.html. -->
<script src="/assets/trang-thai-config.js?nc=20260812160000"></script>
<script src="/assets/trang-thai-snapshot.js?nc=20260826"></script>
<script src="lots-era-100.js?nc=20260826b"></script>
<script>
(function(){
	/* 🔴 26/08: LKEY doi tu 'eralots_flycam' -> '_v2'.
	   Hom nay XOA SACH 11 gim cu (anh nen doi, toa do cu vo nghia) va
	   Anh se gim lai 100 lo. Giu key cu la trinh duyet Anh KHOI PHUC
	   11 gim cu tu localStorage roi BO QUA era_lots_data() moi - im
	   lang, khong mot dong loi. Dung ho loi da dinh 2 lan ngay 24/08. */
	var LKEY = 'eralots_flycam_v2';
	var BYMA = {}, i;
	for(i=0;i<LOTS_ERA100.length;i++){ BYMA[LOTS_ERA100[i].c] = LOTS_ERA100[i]; }

	/* ================= TRANG THAI BAN HANG (26/08, dot 5) =================
	   🔴 TRUOC DAY: 50 ma "chua mo ban" go CUNG trong lots-era-100.js
	      (`LOTS_CHUA_MO_BAN`). DA BO HAN.
	      Ly do: Sheet la nguon that cua /giohang/ va /banghang/. De them mot
	      danh sach cung o day la HAI NGUON CUNG NOI VE MOT VIEC — Anh khoa
	      them mot lo tren Sheet thi gio hang doi ngay con tour VAN HIEN lo do
	      cho khach, khong loi, khong canh bao. Dung ho loi da can nhieu lan.

	   Gio: `Lock` tren Sheet  ==  lo chua mo ban  ==  gim an o ban khach.

	   ⏱️ HAI NHIP NAP, co chu y:
	     nhip 1 (DONG BO, co ngay)  : doc window.ERA_TT_SNAPSHOT
	     nhip 2 (bat dong bo, ~1-8s): ERA_TT.nap() -> Sheet, xong thi de len
	   Khong co nhip 1 thi trong luc cho Google, TT_DATA rong -> moi lo deu
	   "khong phai Lock" -> KHACH THAY CA 50 LO KHOA trong vai giay. */
	var TT_DATA = null;          /* null = chua biet gi */
	var TT_NHAN = '';

	function ttTuSnapshot(){
		var s = window.ERA_TT_SNAPSHOT, out = {};
		if(!s || !Array.isArray(s.lots) || !window.ERA_TT) return null;
		s.lots.forEach(function(l){
			if(!l || !l.ma) return;
			out[ERA_TT.chuanMa(l.ma)] = { st: ERA_TT.chuan(l.st), gia: l.gia || '', note: l.note || '' };
		});
		TT_NHAN = 'File dự phòng' + (s.luc ? ' · ' + s.luc : '');
		return Object.keys(out).length ? out : null;
	}
	function stCua(ma){
		var r = TT_DATA && TT_DATA[ma];
		return (r && r.st) || 'Còn hàng';
	}
	var TOOLMODE = /[?&]tool=1(&|$)/.test(location.search);

	/* 🔴 26/08 Anh Tony chot: them hau to  ?era  cho SALE xem du 100 lo.
	   Tach bach 2 viec:
	     ?era    chi HIEN du 100 gim, KHONG mo bo cong cu gim
	     ?tool=1 moi mo bo cong cu (dat/keo/xuat code)
	   De chung mot cua thi sale lo tay keo gim la lech het du lieu.
	   ⚠️ CO Y KHONG nhan ?tool=0 — doc nhu "tat cong cu" nen de nham, va
	      khach to mo sua ?tool=1 thanh ?tool=0 la vo tinh thay hang khoa. */
	var ERAMODE  = /[?&]era(=|&|$)/.test(location.search);
	var HIEN_KHOA = TOOLMODE || ERAMODE;

	/* 🔴 Chua biet trang thai thi coi nhu KHOA (an). Tha an nham mot lo con
	   ban duoc, con hon lo ra cho khach mot lo chu dau tu chua cho ban. */
	function laKhoa(ma){
		if(!TT_DATA) return true;
		return stCua(ma) === 'Lock';
	}

	function K(){ return document.getElementById('krpanoSWFObject'); }

	/* ---- NAP TRANG THAI: nhip 1 dong bo, nhip 2 tu Sheet ---- */
	TT_DATA = ttTuSnapshot();
	if(window.ERA_TT){
		ERA_TT.nap().then(function(kq){
			if(!kq || !kq.data || !Object.keys(kq.data).length) return;
			TT_DATA = kq.data;
			TT_NHAN = kq.nhan + (kq.luc ? ' · ' + kq.luc : '');
			apTrangThai();          /* de len ket qua cua snapshot */
		}).catch(function(){});
	}
	function hn(ma){ return 'lot_' + String(ma).split('-').join('_'); }
	function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

	/* thu tu cac gim da dat - de nut XOA LO VUA DAT biet xoa cai nao */
	var order = [];

	/* ============ (0) BO LOC  (26/08 - Anh Tony dat) ============
	   Loc theo DIEN TICH (2 thanh keo) + GO MA LO.

	   🔴🔴 LUAT SONG CON: BO LOC KHONG DUOC DUNG `visible`.
	   `visible` da co HAI chu khac: (a) an 50 lo chua mo ban;
	   (b) panel LOP HIEN THI trong era-layers-360.xml bat/tat lop
	   "San pham" — no con nho `lay_hid` de biet cai nao chinh no da an.
	   Chen chan vao la 3 nguon cung ghi mot co, gim bien mat ma khong
	   ai biet tai cai nao (dung ho loi da can 2 lan: 12/08 va 26/08).
	   => Bo loc chi dung `alpha` + `enabled`. Hai co doc lap han.

	   ALPHA0 nho do mo GOC cua tung gim (1 = lo mo ban, 0.42 = lo khoa
	   dang xem bang ?era). Bo loc tra ve dung do mo goc, khong phai 1. */
	var ALPHA0 = {};
	var LOC = { q:'', min:0, max:0, st:'' };
	var LOC_MIN = 0, LOC_MAX = 0;

	function dsLot(){
		/* tap lo dang co nghia trong che do hien tai */
		return LOTS_ERA100.filter(function(l){ return HIEN_KHOA || !laKhoa(l.c); });
	}
	function lotQuaLoc(l){
		if(LOC.q){
			var q = LOC.q.toUpperCase();
			if(l.c.toUpperCase().indexOf(q) < 0 && String(l.z).toUpperCase().indexOf(q) < 0) return false;
		}
		if(LOC_MAX > 0 && (l.a < LOC.min || l.a > LOC.max)) return false;
		if(LOC.st && stCua(l.c) !== LOC.st) return false;
		return true;
	}

	/* Sheet ve sau -> tinh lai TAT CA: lo nao khoa, do mo goc, dai dien tich,
	   so dem tren tung nut trang thai. Goi lai bao nhieu lan cung duoc. */
	function apTrangThai(){
		var k = K(); if(!k) return;
		LOTS_ERA100.forEach(function(l){
			var nm = hn(l.c);
			if(ALPHA0[l.c] === undefined) return;        /* gim chua dat */
			var kh = laKhoa(l.c);
			ALPHA0[l.c] = (kh && HIEN_KHOA) ? 0.42 : 1;
			if(kh && !HIEN_KHOA){
				k.set('hotspot[' + nm + '].visible', false);
				k.set('hotspot[' + nm + '].enabled', false);
				k.set('hotspot[' + nm + '].khoa', true);
			}else{
				k.set('hotspot[' + nm + '].visible', true);
				k.set('hotspot[' + nm + '].khoa', false);
				k.set('hotspot[' + nm + '].bgborder',
				      kh ? '1 0xE08B2A 0.85' : '1 0x7ADD8B 0.80');
			}
		});
		dungBoLoc();      /* dung bang loc lan dau, hoac tinh lai dai dien tich */
		capNhatDaiVaNut();
		apLoc();
	}
	function apLoc(){
		var k = K(); if(!k) return;
		var n = 0;
		dsLot().forEach(function(l){
			var nm = hn(l.c);
			if(ALPHA0[l.c] === undefined) return;      /* gim chua dat */
			var ok = lotQuaLoc(l);
			if(ok) n++;
			k.set('hotspot[' + nm + '].alpha',   ok ? ALPHA0[l.c] : 0);
			k.set('hotspot[' + nm + '].enabled', ok);
		});
		var d = document.getElementById('elf-dem');
		if(d) d.textContent = 'Đang hiện ' + n + ' / ' + dsLot().length + ' lô';
		var chip = document.getElementById('elf-chip');
		if(chip){
			var dangLoc = !!LOC.q || !!LOC.st
			            || (LOC_MAX > 0 && (LOC.min > LOC_MIN || LOC.max < LOC_MAX));
			/* 26/08: cung tong DA VANG, luc dang loc thi dam hon mot bac —
			   de Anh liec la biet co dang loc khong, khong phai mo bang ra xem. */
			chip.style.background  = dangLoc ? '#E3B94F' : '#F2E2BE';
			chip.style.borderColor = dangLoc ? 'rgba(74,59,20,.45)' : 'rgba(74,59,20,.22)';
			chip.textContent = dangLoc ? ('LỌC · ' + n) : 'LỌC LÔ';
		}
	}

	/* ============ (1) BOX THONG TIN ============ */
	var mx = 0, my = 0, pinned = false;
	document.addEventListener('mousemove', function(e){ mx = e.clientX; my = e.clientY; }, true);

	function boxEl(){
		var b = document.getElementById('era-lot-box');
		if(!b){
			b = document.createElement('div');
			b.id = 'era-lot-box';
			b.style.cssText = 'position:fixed;z-index:99998;display:none;pointer-events:none;'
				+ 'min-width:216px;background:rgba(13,38,32,.94);border:1px solid rgba(203,240,214,.22);'
				+ 'border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);padding:12px 14px;'
				+ "font-family:Inter,Arial,sans-serif;color:#EDF8EF;";
			document.body.appendChild(b);
		}
		return b;
	}

	/* 12/08 - Anh Tony chot: ma A = KHU PHU QUY, ma B = KHU GIA AN
	   🔴 26/08 Anh Tony sua ten khu: "Khu Phu Gia" -> "KHU PHU QUY".
	   ⚠️ CHI doi TEN PHAN KHU. "Phu Gia Bao Loc" la TEN DU AN, nam o
	      hon 40 cho khac (tieu de trang, wordmark, manifest, skin...) —
	      TUYET DOI khong thay hang loat, thay het la doi luon ten du an.
	   Ben `giohang/index.html` da doi truoc (18:03 hom nay, phien chat
	   khac) va ghi la 'Khu Phú Quý'; o day de IN HOA vi chip hien in hoa. */
	function khuCua(ma){
		var c = String(ma || '').charAt(0).toUpperCase();
		return c === 'B' ? 'KHU GIA AN' : 'KHU PHÚ QUÝ';
	}

	/* 🔴 26/08: bo qua ca so 0 — GIONG HET bo loc ben giohang/index.html
	   (`v===undefined||v===''||v===0`). De lot so 0 vao la bang in
	   "Lo gioi 0 m", sale doc xong tuong dat khong co duong. */
	function rowHtml(k, v, unit){
		if(v === '' || v == null || v === 0) return '';
		return '<div style="display:flex;justify-content:space-between;gap:18px;padding:3px 0;font-size:12px;">'
			+ '<span style="color:#83A08D;">' + k + '</span>'
			+ '<span style="color:#EDF8EF;font-weight:600;">' + esc(v) + (unit || '') + '</span></div>';
	}

	function render(ma){
		var l = BYMA[ma];
		var b = boxEl();
		if(!l){
			b.innerHTML = '<div style="font-size:14px;font-weight:700;">' + esc(ma) + '</div>'
				+ '<div style="font-size:11px;color:#83A08D;margin-top:4px;">Chưa có dữ liệu cho lô này</div>';
			return b;
		}
		/* 🔴 26/08 Anh Tony chot: bang nay in DAY DU nhu bang chi tiet ben
		   `giohang/index.html` (CAUHINH.thongTin), truoc day thieu han 4 so
		   kich thuoc lo -> sale mo tour ra van phai bam sang trang gio hang.
		   Thu tu giu Y HET ben do: Khu . Dien tich . CD1 . CD2 . CR1 . CR2 .
		   Huong . Lo gioi;  ma lo + loai hinh nam tren dau.
		   ⚠️ cr1/cr2 co the la CHUOI kieu "9.70 - 5.39" (lo meo, 2 canh khac
		   nhau) — in nguyen van, dung ep ve so. Da qua esc(). */
		b.innerHTML =
			'<div style="display:flex;align-items:baseline;justify-content:space-between;gap:14px;">'
			+ '<span style="font-size:17px;font-weight:800;letter-spacing:.4px;">' + esc(l.c) + '</span>'
			+ '<span style="font-size:10px;font-weight:700;letter-spacing:1px;color:#7ADD8B;">' + esc(khuCua(l.c)) + '</span>'
			+ '</div>'
			+ (l.l ? '<div style="font-size:11.5px;color:#9FBFA8;margin-top:2px;">' + esc(l.l) + '</div>' : '')
			+ '<div style="height:1px;background:rgba(203,240,214,.16);margin:9px 0 5px;"></div>'
			+ rowHtml('Diện tích đất', l.a,   ' m²')
			+ rowHtml('Chiều dài 1',   l.cd1, ' m')
			+ rowHtml('Chiều dài 2',   l.cd2, ' m')
			+ rowHtml('Chiều rộng 1',  l.cr1, ' m')
			+ rowHtml('Chiều rộng 2',  l.cr2, ' m')
			+ rowHtml('Hướng',         l.h)
			+ rowHtml('Lộ giới',       l.lg,  ' m')
			/* 26/08: chip tinh trang, lay tu Sheet. Mau dung y het giohang
			   (ERA_TT.MAU) de sale nhin 2 trang khong phai doi mat.
			   ⚠️ CO Y KHONG in GIA o day — Sheet co cot gia nhung tour la
			      trang khach xem; dua gia len la quyet dinh san pham,
			      cho Anh Tony chot. */
			+ (function(){
				var st = stCua(l.c);
				var mau = (window.ERA_TT && ERA_TT.MAU && ERA_TT.MAU[st]) || '#888888';
				return '<div style="display:inline-block;margin-top:9px;padding:3px 10px;border-radius:20px;'
					+ 'background:' + mau + ';color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.3px;">'
					+ esc(st) + '</div>';
			})()
			+ (pinned ? '<div style="font-size:10px;color:#83A08D;margin-top:7px;">Bấm ra ngoài để đóng</div>' : '');
		return b;
	}

	function place(b){
		b.style.display = 'block';
		var w = b.offsetWidth, h = b.offsetHeight;
		var x = mx + 18, y = my - h - 14;
		if(x + w > window.innerWidth - 10)  x = mx - w - 18;
		if(y < 10) y = my + 22;
		if(x < 10) x = 10;
		b.style.left = x + 'px';
		b.style.top  = y + 'px';
	}

	window.lotHover = function(ma){ if(pinned) return; place(render(ma)); };
	window.lotOut   = function(){ if(pinned) return; var b = document.getElementById('era-lot-box'); if(b) b.style.display = 'none'; };
	window.lotClick = function(ma){
		var k = K();
		if(k && String(k.get('lots_edit_on')) === 'true') return;   /* dang sua thi khong ghim box */
		pinned = true; place(render(ma));
		setTimeout(function(){
			document.addEventListener('mousedown', function un(){
				pinned = false;
				var b = document.getElementById('era-lot-box'); if(b) b.style.display = 'none';
				document.removeEventListener('mousedown', un, true);
			}, true);
		}, 0);
	};

	/* ============ (2) DAT GIM ============ */
	window.eraLotSave = function(s){ try{ localStorage.setItem(LKEY, s || ''); }catch(e){} };

	function addPin(ath, atv, ma){
		var k = K(); if(!k) return;
		var name = hn(ma);
		k.call("era_lot(" + ath + "," + atv + ",'" + ma + "'," + name + ")");

		/* 🔴 26/08: lo CHUA MO BAN -> gim VAN DUOC TAO (de con toa do, de
		   con XUAT CODE ra du 100 dong) nhung khong hien cho khach.
		   Trong ?tool=1 thi hien mo di, kem vien cam, de Anh phan biet
		   duoc lo nao dang khoa ma van keo chinh binh thuong. */
		if(laKhoa(ma)){
			if(HIEN_KHOA){
				/* 🔴 Van de MO + vien cam ke ca trong ?era. Cho hien y het lo
				   mo ban la sale KHONG PHAN BIET DUOC, tu van nham lo chua
				   mo ban cho khach — sai sot nay dat hon nhieu so voi viec
				   nhin hoi mo mot chut. */
				k.set('hotspot[' + name + '].alpha', 0.42);
				k.set('hotspot[' + name + '].bgborder', '1 0xE08B2A 0.85');
			}else{
				k.set('hotspot[' + name + '].visible', false);
				k.set('hotspot[' + name + '].enabled', false);
				/* 🔴 co rieng cho bang LOP HIEN THI: era-layers-360.xml doc co nay
				   de KHONG dem lo dang khoa vao so "San pham . N". Khong co no
				   thi bang ghi 100 trong khi khach chi thay 50.
				   ⚠️ KHONG dat co nay trong ?tool=1 -> luc gim Anh van thay du 100. */
				k.set('hotspot[' + name + '].khoa', true);
			}
		}

		/* nho do mo GOC de bo loc tra ve dung muc nay, khong phai 1 */
		ALPHA0[ma] = (laKhoa(ma) && HIEN_KHOA) ? 0.42 : 1;

		var p = order.indexOf(ma); if(p >= 0) order.splice(p, 1);
		order.push(ma);
	}

	window.eraLotRestore = function(){
		var k = K(); if(!k) return;
		var s = ''; try{ s = localStorage.getItem(LKEY) || ''; }catch(e){}
		order = [];
		/* 🔴 11/08: loc RAC trong nhap cu. Truoc day era_lots_save_draft loc bang
		   "malo != null" nen ghi ca hotspot POI/skin vao nhap voi ma = 'null'
		   -> restore de ra 1 gim ma "null" va dem sai so lo. Chi nhan ma co that. */
		if(s){
			var ban = 0;
			s.split('###').forEach(function(line){
				if(!line) return;
				var p = line.split('|'); if(p.length < 3) return;
				if(!BYMA[p[2]]){ ban++; return; }
				addPin(p[0], p[1], p[2]);
			});
			if(ban > 0){ K().call('era_lots_save_draft()'); }   /* ghi lai nhap da sach */
		}else{
			k.call('era_lots_data()');
		}
		dungBoLoc();   /* 26/08: gim nap xong moi dung duoc bang loc */
	};

	/* ============ (2b) BANG LOC ============ */
	function dungBoLoc(){
		if(document.getElementById('elf-chip')) { apLoc(); return; }
		var ds = dsLot(); if(!ds.length) return;
		var aa = ds.map(function(l){ return l.a; });
		LOC_MIN = Math.min.apply(null, aa);
		LOC_MAX = Math.max.apply(null, aa);
		LOC.min = LOC_MIN; LOC.max = LOC_MAX;

		var css = document.createElement('style');
		css.textContent =
			/* 🔴 26/08 (Anh Tony khoanh tay tren anh iPad): chip doi tu goc TRAI
			   (duoi panel LOP HIEN THI) sang goc PHAI TREN, nam ben TRAI cum 3
			   nut tron cua skin krpano (i / loa / toan man).
			   Cum nut do cach mep phai ~30px, moi nut ~37px  ->  chua 76px de
			   chip khong dam vao. Bang loc thi bam mep phai luon (right 16). */
			'#elf-chip{position:absolute;right:76px;top:20px;z-index:70;padding:7px 13px;border-radius:9px;'
			+ 'font:700 11.5px/1 Inter,Arial,sans-serif;color:#4A3B14;background:#F2E2BE;'
			+ 'border:1px solid rgba(74,59,20,.22);cursor:pointer;user-select:none;letter-spacing:.4px;'
			+ 'box-shadow:0 2px 10px rgba(0,0,0,.28);}'
			/* 🔴 Bang loc phai NE COT NUT TRON cua skin krpano (i / loa / toan man)
			   nam sat mep phai. De right:16 la bang trum len 3 nut do, bam khong
			   duoc. Lay right:76 = thang hang duoi chip, chua tron cot nut. */
			+ '#elf-pan{position:absolute;right:76px;top:58px;z-index:70;width:236px;display:none;'
			+ 'background:rgba(13,38,32,.94);border:1px solid rgba(242,226,190,.35);border-radius:12px;'
			+ 'padding:12px 13px;font-family:Inter,Arial,sans-serif;color:#EDF8EF;'
			+ 'box-shadow:0 10px 30px rgba(0,0,0,.45);}'
			+ '#elf-pan.mo{display:block;}'
			+ '#elf-pan input[type=text]{width:100%;box-sizing:border-box;padding:8px 9px;border-radius:8px;'
			+ 'border:1px solid rgba(203,240,214,.2);background:#0E2821;color:#EDF8EF;font-size:12.5px;outline:none;}'
			+ '#elf-pan .lb{font-size:10.5px;color:#83A08D;margin:11px 0 5px;letter-spacing:.3px;}'
			+ '#elf-st{display:flex;flex-wrap:wrap;gap:5px;}'
			+ '#elf-st button{flex:1 1 auto;padding:6px 7px;border-radius:7px;cursor:pointer;'
			+ 'border:1px solid rgba(203,240,214,.22);background:rgba(255,255,255,.05);color:#CFE3D6;'
			+ 'font:700 10.5px Inter,Arial,sans-serif;white-space:nowrap;}'
			+ '#elf-st button.on{background:#F2E2BE;color:#4A3B14;border-color:rgba(74,59,20,.3);}'
			+ '#elf-ng{font-size:9.5px;color:#6E8A78;margin-top:8px;line-height:1.35;}'
			+ '#elf-pan input[type=range]{width:100%;margin:2px 0;accent-color:#7ADD8B;}'
			+ '#elf-dem{font-size:11px;color:#7ADD8B;font-weight:700;margin-top:10px;}'
			+ '#elf-xoa{margin-top:9px;width:100%;padding:8px;border:0;border-radius:8px;background:#2A4A3E;'
			+ 'color:#EDF8EF;font:700 11.5px Inter,Arial,sans-serif;cursor:pointer;}'
			/* 🔴 iPad gen 9 NGANG = 1080 CSS -> di nhanh desktop. Man hep hon
			   (iPad DOC 810) thi thu chip lai mot chut, bang loc hep theo mh. */
			+ '@media (max-width:820px){#elf-chip{right:70px;top:14px;padding:6px 11px;font-size:11px;}'
			+ '#elf-pan{right:70px;top:50px;width:min(232px,64vw);}}';
		document.head.appendChild(css);

		var chip = document.createElement('div');
		chip.id = 'elf-chip'; chip.textContent = 'LỌC LÔ';
		var pan = document.createElement('div');
		pan.id = 'elf-pan';
		pan.innerHTML =
			'<input type="text" id="elf-q" placeholder="Gõ mã lô, vd A8 hoặc B4-17">'

	function capNhatDaiVaNut(){

	/* ============ (3) GOI Y TU DONG ============
	   Cac lo nam tren mat dat phang, may bay chup tu tren cao => phep chieu
	   tu toa do mat bang (px,py) sang huong nhin 360 la 1 ma tran 3x3.
	   Anh dat >= 4 lo rai deu => giai ma tran => bung not cac lo con lai.
	   Dat cang nhieu moc va cang trai deu thi cang chuan.                */

	function dirOf(athDeg, atvDeg){
		var a = athDeg * Math.PI / 180, v = atvDeg * Math.PI / 180;
		return [Math.sin(a) * Math.cos(v), -Math.sin(v), Math.cos(a) * Math.cos(v)];
	}

	function jacobi(A, n){
		var V = [], a = [], p, q, k, r, c;
		for(r=0;r<n;r++){ V.push([]); a.push(A[r].slice()); for(c=0;c<n;c++) V[r].push(r===c?1:0); }
		for(var sweep=0; sweep<80; sweep++){
			var off = 0;
			for(p=0;p<n;p++) for(q=p+1;q<n;q++) off += a[p][q]*a[p][q];
			if(off < 1e-22) break;
			for(p=0;p<n-1;p++) for(q=p+1;q<n;q++){
				if(Math.abs(a[p][q]) < 1e-24) continue;
				var th = (a[q][q]-a[p][p]) / (2*a[p][q]);
				var sg = th >= 0 ? 1 : -1;
				var t  = sg / (Math.abs(th) + Math.sqrt(th*th+1));
				var cc = 1/Math.sqrt(t*t+1), ss = t*cc;
				for(k=0;k<n;k++){ var akp=a[k][p], akq=a[k][q]; a[k][p]=cc*akp-ss*akq; a[k][q]=ss*akp+cc*akq; }
				for(k=0;k<n;k++){ var apk=a[p][k], aqk=a[q][k]; a[p][k]=cc*apk-ss*aqk; a[q][k]=ss*apk+cc*aqk; }
				for(k=0;k<n;k++){ var vkp=V[k][p], vkq=V[k][q]; V[k][p]=cc*vkp-ss*vkq; V[k][q]=ss*vkp+cc*vkq; }
			}
		}
		var d = []; for(r=0;r<n;r++) d.push(a[r][r]);
		return { V:V, d:d };
	}

	function solveH(pairs){
		var n = pairs.length, i, j;
		var mx0 = 0, my0 = 0;
		for(i=0;i<n;i++){ mx0 += pairs[i].u; my0 += pairs[i].v; }
		mx0 /= n; my0 /= n;
		var sc = 0;
		for(i=0;i<n;i++) sc += Math.hypot(pairs[i].u-mx0, pairs[i].v-my0);
		sc = sc > 0 ? (n * Math.SQRT2 / sc) : 1;
		var norm = function(u, v){ return [(u-mx0)*sc, (v-my0)*sc]; };

		var rows = [];
		for(i=0;i<n;i++){
			var p = norm(pairs[i].u, pairs[i].v), d = pairs[i].d;
			var P = [p[0], p[1], 1];
			rows.push([ 0,0,0, -d[2]*P[0],-d[2]*P[1],-d[2]*P[2],  d[1]*P[0], d[1]*P[1], d[1]*P[2] ]);
			rows.push([ d[2]*P[0], d[2]*P[1], d[2]*P[2], 0,0,0, -d[0]*P[0],-d[0]*P[1],-d[0]*P[2] ]);
			rows.push([ -d[1]*P[0],-d[1]*P[1],-d[1]*P[2], d[0]*P[0], d[0]*P[1], d[0]*P[2], 0,0,0 ]);
		}
		var M = [];
		for(i=0;i<9;i++){ M.push([]); for(j=0;j<9;j++) M[i].push(0); }
		rows.forEach(function(r){ for(i=0;i<9;i++) for(j=0;j<9;j++) M[i][j] += r[i]*r[j]; });

		var e = jacobi(M, 9);
		var best = 0;
		for(i=1;i<9;i++) if(e.d[i] < e.d[best]) best = i;
		var h = []; for(i=0;i<9;i++) h.push(e.V[i][best]);

		return function(u, v){
			var p = norm(u, v);
			var x = h[0]*p[0] + h[1]*p[1] + h[2];
			var y = h[3]*p[0] + h[4]*p[1] + h[5];
			var z = h[6]*p[0] + h[7]*p[1] + h[8];
			if(y > 0){ x = -x; y = -y; z = -z; }        /* mat dat luon nam duoi tam nhin */
			var ath = Math.atan2(x, z) * 180 / Math.PI;
			var atv = -Math.atan2(y, Math.hypot(x, z)) * 180 / Math.PI;
			return [ath, atv];
		};
	}

	window.eraLotAuto = function(){
		var k = K(); if(!k) return;
		var pairs = [];
		order.forEach(function(ma){
			var l = BYMA[ma]; if(!l) return;
			var ath = parseFloat(k.get('hotspot[' + hn(ma) + '].ath'));
			var atv = parseFloat(k.get('hotspot[' + hn(ma) + '].atv'));
			if(isFinite(ath) && isFinite(atv)) pairs.push({ u:l.px, v:l.py, d:dirOf(ath, atv), ma:ma });
		});
		if(pairs.length < 4){
			alert('Cần đặt tay ít nhất 4 lô (nên rải đều 2 đầu khu đất) rồi mới bấm GỢI Ý TỰ ĐỘNG.\nHiện mới có ' + pairs.length + ' lô.');
			return;
		}
		var f = solveH(pairs);

		/* sai so tren chinh cac lo Anh da dat - de biet co tin duoc khong */
		var se = 0;
		pairs.forEach(function(p){
			var r = f(p.u, p.v);
			var a0 = parseFloat(k.get('hotspot[' + hn(p.ma) + '].ath'));
			var v0 = parseFloat(k.get('hotspot[' + hn(p.ma) + '].atv'));
			var da = ((r[0] - a0 + 540) % 360) - 180;
			se += da*da + (r[1]-v0)*(r[1]-v0);
		});
		var rms = Math.sqrt(se / pairs.length);

		var added = 0;
		LOTS_ERA100.forEach(function(l){
			if(order.indexOf(l.c) >= 0) return;
			var r = f(l.px, l.py);
			if(!isFinite(r[0]) || !isFinite(r[1])) return;
			addPin(Math.round(r[0]*100)/100, Math.round(r[1]*100)/100, l.c);
			added++;
		});
		k.call('era_lots_save_draft()');
		/* 26/08: dem rieng so lo se AN o ban khach, de Anh biet minh dang
		   nhin 100 gim nhung khach chi thay phan mo ban. */
		var nkhoa = 0;
		order.forEach(function(m){ if(laKhoa(m)) nkhoa++; });
		k.set('layer[lots_readout].html', 'Đã bung ' + added + ' lô · sai số trên ' + pairs.length
			+ ' mốc ≈ ' + (Math.round(rms*100)/100) + '° · kéo chỉnh lô nào lệch'
			+ (nkhoa ? '<br><span style="color:#E08B2A;">' + nkhoa + ' lô chấm cam = chưa mở bán, khách sẽ KHÔNG thấy</span>' : ''));
	};
})();
</script>

<script>
/* 🔴 BAY DA LUONG TRUOC — TOAN MAN HINH LAM MAT THANH NAV.
   Menu cu ve BEN TRONG krpano nen bam ⛶ van con. Menu HTML nam ngoai
   #pano -> khi krpano goi Fullscreen API len #pano thi trinh duyet CHI ve

   Cach chua: nghe su kien fullscreenchange, chuyen #era-nav vao dung phan

(function () {
	function chuyenNav() {
		var nav = document.getElementById('era-nav');
		if (!nav) return;
		var fs = document.fullscreenElement || document.webkitFullscreenElement || null;
		var dich = fs || document.body;
		if (nav.parentNode !== dich) dich.appendChild(nav);
	}
	document.addEventListener('fullscreenchange', chuyenNav);
	document.addEventListener('webkitfullscreenchange', chuyenNav);
})();
