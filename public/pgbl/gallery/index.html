<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gallery — Phú Gia Bảo Lộc | ERA Vietnam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css">
<style>
  :root{
    --base:#0D2620; --panel:#0E2821; --gold:#BF9642;
    --lime:#9BDC4C; --teal:#5FE5BE; --accent:#A9F0C4;
    --text:#EDF8EF; --text2:#BAD8C3; --dim:#83A08D; --line:rgba(203,240,214,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--text);
    background:radial-gradient(120% 80% at 50% -10%,#16342B 0%,#0D2620 46%,#081712 100%);min-height:100vh;-webkit-font-smoothing:antialiased}

  header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 26px;flex-wrap:wrap}
  .brand img{height:32px;width:auto;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
  .htitle{text-align:right}
  .htitle h1{font-size:22px;font-weight:800;letter-spacing:.3px}
  .htitle span{font-size:12px;color:var(--text2)}

  .wrap{max-width:1160px;margin:0 auto;padding:8px 22px 40px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:840px){.grid{grid-template-columns:1fr 1fr}}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
  .item{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);cursor:pointer;
    background:var(--panel);aspect-ratio:4/3;box-shadow:0 8px 26px rgba(0,0,0,.32);
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
  .item:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.45);border-color:rgba(159,220,76,.5)}
  .item img{width:100%;height:100%;object-fit:cover;display:block}
  .item .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 12px;font-size:13px;font-weight:600;
    background:linear-gradient(180deg,transparent,rgba(8,20,15,.85))}
  .item .cap i{color:var(--accent);margin-right:6px}

  /* Lightbox */
  #lb{position:fixed;inset:0;z-index:9500;display:none;align-items:center;justify-content:center;
    background:rgba(6,16,12,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #lb.on{display:flex}
  #lb img{max-width:92vw;max-height:80vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #lb .cap{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:15px;font-weight:600;color:var(--text)}
  #lb button{position:absolute;background:rgba(14,40,33,.7);border:1px solid var(--line);color:var(--text);
    width:52px;height:52px;border-radius:50%;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .18s,color .18s}
  #lb button:hover{background:rgba(95,229,190,.2);color:var(--accent)}
  #lb .prev{left:18px;top:50%;transform:translateY(-50%)}
  #lb .next{right:18px;top:50%;transform:translateY(-50%)}
  #lb .close{top:18px;right:18px;width:44px;height:44px;font-size:22px}
  @media(max-width:560px){#lb .prev{left:8px}#lb .next{right:8px}#lb button{width:44px;height:44px;font-size:22px}}
</style>
</head>
<body>
  <header>
    <a class="brand" href="/" target="_top"><img src="../assets/wordmark.png" alt="Phú Gia Bảo Lộc"></a>
    <div class="htitle"><h1>Gallery</h1><span>Phối cảnh · Tiện ích · Vị trí dự án</span></div>
  </header>

  <div class="wrap">
    <div class="grid" id="grid"></div>
  </div>

  <div id="lb" role="dialog" aria-modal="true">
    <button class="close" aria-label="Đóng">&times;</button>
    <button class="prev" aria-label="Trước">&#8249;</button>
    <img id="lbimg" src="" alt="">
    <div class="cap" id="lbcap"></div>
    <button class="next" aria-label="Sau">&#8250;</button>
  </div>

  <script src="../assets/eranav.js?nc=20260814224500" data-active="gallery"></script>
  <script>
  var IMGS = [
    { src:'img/nhamau.jpg',     cap:'Nhà mẫu dự án',            ic:'ph-house-line' },
    { src:'img/ti-congvien.jpg',cap:'Công viên nội khu',         ic:'ph-tree' },
    { src:'img/ti-vuonthien.jpg',cap:'Vườn thiền',               ic:'ph-flower-lotus' },
    { src:'img/ti-hoca.jpg',    cap:'Hồ cảnh quan',             ic:'ph-waves' },
    { src:'img/ti-cafe.jpg',    cap:'Café khu trung tâm',       ic:'ph-coffee' },
    { src:'img/ti-apollo.jpg',  cap:'Trường học Apollo',        ic:'ph-graduation-cap' },
    { src:'img/mb-5x20.jpg',    cap:'Mẫu nhà 5×20',            ic:'ph-blueprint' },
    { src:'img/mb-7x20.jpg',    cap:'Mẫu nhà 7×20',            ic:'ph-blueprint' },
    { src:'img/vitri-map.jpg',  cap:'Vị trí & liên kết vùng',  ic:'ph-map-pin' }
  ];
  var grid = document.getElementById('grid');
  IMGS.forEach(function(o,i){
    var a = document.createElement('div');
    a.className = 'item';
    a.innerHTML = '<img src="'+o.src+'" alt="'+o.cap+'" loading="lazy">' +
      '<div class="cap"><i class="ph-light '+o.ic+'"></i>'+o.cap+'</div>';
    a.addEventListener('click', function(){ open(i); });
    grid.appendChild(a);
  });

  var lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg'),
      lbcap = document.getElementById('lbcap'), cur = 0;
  function open(i){ cur=i; render(); lb.classList.add('on'); }
  function render(){ var o=IMGS[cur]; lbimg.src=o.src; lbimg.alt=o.cap; lbcap.textContent=o.cap; }
  function step(d){ cur=(cur+d+IMGS.length)%IMGS.length; render(); }
  function close(){ lb.classList.remove('on'); }
  lb.querySelector('.close').addEventListener('click', close);
  lb.querySelector('.prev').addEventListener('click', function(e){ e.stopPropagation(); step(-1); });
  lb.querySelector('.next').addEventListener('click', function(e){ e.stopPropagation(); step(1); });
  lb.addEventListener('click', function(e){ if(e.target===lb) close(); });
  document.addEventListener('keydown', function(e){
    if(!lb.classList.contains('on')) return;
    if(e.key==='Escape') close();
    else if(e.key==='ArrowLeft') step(-1);
    else if(e.key==='ArrowRight') step(1);
  });
  </script>
</body>
</html>
